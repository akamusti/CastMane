[project]
name = "castmane"
version = "0.9.0"
description = "Crash-safe screen recorder for Linux (Wayland-first, Qt + GStreamer/FFmpeg)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "dbus-next>=0.2.3",  # Wayland ScreenCast portal client
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
packaging = ["pyinstaller>=6"]

[project.scripts]
castmane = "castmane.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
castmane = ["assets/*"]

[tool.ruff]
target-version = "py310"
